<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Submit a product review by selecting a product, rating, installation date, useful features, and optional comments.">

    <meta name="author"
        content="Lorddesmond">

    <title>Product Review</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>

</head>

<body>

    <header>

        <h1>Product Review</h1>

    </header>


    <main>

        <form method="get" action="review.html">

            <!-- Product Name -->
            <fieldset>

                <label for="product">
                    Product Name
                </label>

                <select id="product"
                    name="product"
                    required>

                    <option value=""
                        disabled
                        selected>
                        Select a Product ...
                    </option>

                </select>

            </fieldset>


            <!-- Overall Rating -->
            <fieldset>

                <legend>
                    Overall Rating
                </legend>

                <div class="rating">

                    <div class="rating-option">

                        <label for="rating1">
                            ☆
                        </label>

                        <input type="radio"
                            id="rating1"
                            name="rating"
                            value="1"
                            required>

                    </div>


                    <div class="rating-option">

                        <label for="rating2">
                            ☆☆
                        </label>

                        <input type="radio"
                            id="rating2"
                            name="rating"
                            value="2"
                            required>

                    </div>


                    <div class="rating-option">

                        <label for="rating3">
                            ☆☆☆
                        </label>

                        <input type="radio"
                            id="rating3"
                            name="rating"
                            value="3"
                            required>

                    </div>


                    <div class="rating-option">

                        <label for="rating4">
                            ☆☆☆☆
                        </label>

                        <input type="radio"
                            id="rating4"
                            name="rating"
                            value="4"
                            required>

                    </div>


                    <div class="rating-option">

                        <label for="rating5">
                            ☆☆☆☆☆
                        </label>

                        <input type="radio"
                            id="rating5"
                            name="rating"
                            value="5"
                            required>

                    </div>

                </div>

            </fieldset>


            <!-- Date of Installation -->
            <fieldset>

                <label for="installed">
                    Date of Installation
                </label>

                <input type="date"
                    id="installed"
                    name="installed"
                    required>

            </fieldset>


            <!-- Useful Features -->
            <fieldset>

                <label>
                    Which features did you find useful in the product?
                </label>

                <p class="hint">
                    (Check all that apply)
                </p>


                <div class="features">

                    <div>

                        <input type="checkbox"
                            id="durability"
                            name="features"
                            value="durability">

                        <label for="durability">
                            Durability
                        </label>

                    </div>


                    <div>

                        <input type="checkbox"
                            id="ease"
                            name="features"
                            value="ease of use">

                        <label for="ease">
                            Ease of Use
                        </label>

                    </div>


                    <div>

                        <input type="checkbox"
                            id="performance"
                            name="features"
                            value="performance">

                        <label for="performance">
                            Performance
                        </label>

                    </div>


                    <div>

                        <input type="checkbox"
                            id="design"
                            name="features"
                            value="design">

                        <label for="design">
                            Design
                        </label>

                    </div>

                </div>

            </fieldset>


            <!-- Written Review -->
            <fieldset>

                <label for="review">

                    Written Review

                    <span class="optional">
                        (Optional)
                    </span>

                </label>

                <textarea id="review"
                    name="review"
                    rows="5"></textarea>

            </fieldset>


            <!-- User Name -->
            <fieldset>

                <label for="username">

                    Your Name

                    <span class="optional">
                        (Optional)
                    </span>

                </label>

                <input type="text"
                    id="username"
                    name="username">

            </fieldset>


            <!-- Submit Button -->

            <input type="submit"
                value="Post Review">

        </form>

    </main>


    <footer>

        <p>
            &copy;
            <span id="currentyear"></span>
            Lorddesmond
        </p>

        <p>
            Last Modification:
            <span id="lastModified"></span>
        </p>

    </footer>

</body>

</html>

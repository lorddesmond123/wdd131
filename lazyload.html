<head>

    <title>Lazy Loading Images</title>
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>
    <main>
        <h1>Lazy Loading Images</h1>

        <img src="https://picsum.photos/400/600?random=1" alt="A random scenic photo number one"

            loading="lazy" width="400" height="600">
        <img src="https://picsum.photos/400/600?random=4" alt="A random scenic photo number four"
            loading="lazy" width="400" height="600">
        <img src="https://picsum.photos/400/600?random=5" alt="A random scenic photo number five"
            loading="lazy" width="400" height="600">
        <img src="https://picsum.photos/400/600?random=6" alt="A random scenic photo number six"
            loading="lazy" width="400" height="600">
    </main>

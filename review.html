<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Confirmation page for a submitted product review showing the number of reviews completed.">

    <meta name="author"
        content="Lorddesmond">

    <title>Product Review Submitted</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>

</head>

<body>

    <header>

        <h1>Product Review</h1>

    </header>


    <main>

        <section class="confirmation">

            <h2>Thank You!</h2>

            <p>
                Your product review has been submitted successfully.
            </p>

            <p>
                This is review number
                <strong id="reviewCount">0</strong>.
            </p>

            <a href="form.html">
                Write Another Review
            </a>

        </section>

    </main>


    <footer>

        <p>
            &copy;
            <span id="currentyear"></span>
            Lorddesmond
        </p>

        <p>
            Last Modification:
            <span id="lastModified"></span>
        </p>

    </footer>

</body>

</html>
